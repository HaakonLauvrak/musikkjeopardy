<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topp 10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #07080f;
    --panel: #12152a;
    --panel-edge: #232849;
    --gold: #f6c945;
    --gold-hot: #ffe08a;
    --violet: #8b7cff;
    --text: #f2f1ec;
    --text-dim: #9a9cb5;
    --display: "Anton", sans-serif;
    --body: "Space Grotesk", sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: var(--body);
    background: var(--ink);
    color: var(--text);
    overflow: hidden;
  }
  body::before, body::after {
    content: "";
    position: fixed;
    inset: -30%;
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    background: radial-gradient(ellipse 40% 50% at 18% 8%, rgba(139,124,255,.14), transparent 60%);
    animation: drift-a 26s ease-in-out infinite alternate;
  }
  body::after {
    background: radial-gradient(ellipse 45% 55% at 85% 92%, rgba(246,201,69,.10), transparent 60%);
    animation: drift-b 32s ease-in-out infinite alternate;
  }
  @keyframes drift-a { to { transform: translate(6%, 4%) } }
  @keyframes drift-b { to { transform: translate(-5%, -4%) } }

  #app {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: clamp(10px, 1.8vh, 24px) clamp(14px, 2.4vw, 40px);
    gap: clamp(10px, 1.8vh, 20px);
  }

  header {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  header h1 {
    font-family: var(--display);
    font-size: clamp(1.5rem, 3.2vh, 2.2rem);
    letter-spacing: .06em;
    color: var(--gold);
    text-shadow: 0 0 24px rgba(246,201,69,.35);
    font-weight: 400;
  }
  header .tagline {
    color: var(--text-dim);
    font-size: clamp(.75rem, 1.6vh, 1rem);
  }
  header .spacer { flex: 1 }
  .chip {
    font-family: var(--body);
    font-size: .85rem;
    color: var(--text-dim);
    background: none;
    border: 1px solid var(--panel-edge);
    border-radius: 8px;
    padding: 6px 14px;
    cursor: pointer;
    text-decoration: none;
    transition: color .2s, border-color .2s;
  }
  .chip:hover { color: var(--gold); border-color: var(--gold) }
  .chip.danger:hover, .chip.armed { color: #ff5470; border-color: #ff5470 }

  /* ── Category intro ─────────────────────── */
  #intro {
    flex: 1;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: clamp(16px, 3.6vh, 38px);
    padding-bottom: 6vh;
  }
  #intro.open { display: flex }
  #intro .eyebrow {
    color: var(--violet);
    letter-spacing: .34em;
    text-transform: uppercase;
    font-size: clamp(.75rem, 1.8vh, 1.05rem);
    animation: rise .6s ease both;
  }
  #intro .cat-name {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(1.4rem, 4.6vh, 3rem);
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--text-dim);
    animation: rise .6s .1s ease both;
  }
  #intro .cat-q {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(2.2rem, 9vh, 5.6rem);
    line-height: 1.05;
    letter-spacing: .03em;
    color: var(--gold);
    text-shadow: 0 0 50px rgba(246,201,69,.35);
    max-width: 20ch;
    animation: rise .6s .2s ease both;
  }
  #intro .cat-note {
    color: var(--text-dim);
    font-size: clamp(.85rem, 2vh, 1.1rem);
    animation: rise .6s .3s ease both;
  }
  #intro .actions { display: flex; gap: 12px; animation: rise .6s .4s ease both }
  @keyframes rise {
    from { opacity: 0; transform: translateY(18px) }
    to   { opacity: 1; transform: none }
  }

  /* ── List / reveal view ─────────────────── */
  #list-view { flex: 1; display: none; flex-direction: column; gap: clamp(8px, 1.6vh, 16px); min-height: 0 }
  #list-view.open { display: flex }

  #question {
    text-align: center;
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(1.4rem, 4.4vh, 2.9rem);
    letter-spacing: .04em;
    line-height: 1.15;
  }
  #list-note { text-align: center; color: var(--text-dim); font-size: clamp(.75rem, 1.7vh, .95rem) }
  #list-note:empty { display: none }

  #rows {
    flex: 1;
    display: grid;
    gap: clamp(4px, .9vh, 10px);
    min-height: 0;
    align-content: stretch;
  }
  #rows.cols-1 { grid-template-rows: repeat(10, 1fr) }
  #rows.cols-2 { grid-template-rows: repeat(10, 1fr); grid-auto-flow: column; grid-template-columns: 1fr 1fr; column-gap: clamp(12px, 2vw, 28px) }

  .row {
    display: flex;
    align-items: center;
    gap: clamp(10px, 1.4vw, 22px);
    background: linear-gradient(180deg, #161a33, var(--panel));
    border: 1px solid var(--panel-edge);
    border-radius: 12px;
    padding: 0 clamp(12px, 1.6vw, 26px);
    min-height: 0;
  }
  .row .rank {
    font-family: var(--display);
    font-size: clamp(1rem, 3vh, 1.9rem);
    color: var(--violet);
    min-width: 2.2ch;
    text-align: right;
  }
  .row .name {
    font-weight: 700;
    font-size: clamp(1rem, 2.9vh, 1.8rem);
    letter-spacing: .01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row .detail {
    margin-left: auto;
    color: var(--text-dim);
    font-size: clamp(.8rem, 2vh, 1.15rem);
    white-space: nowrap;
  }
  .row .mystery {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .row .mystery i {
    height: clamp(8px, 1.4vh, 12px);
    flex: 1;
    border-radius: 999px;
    background: #1d2140;
  }
  .row.revealed {
    border-color: rgba(246,201,69,.45);
    animation: pop .45s cubic-bezier(.2,.7,.3,1.2);
  }
  .row.revealed .rank { color: var(--gold) }
  .row.top1.revealed {
    background: linear-gradient(180deg, rgba(246,201,69,.16), var(--panel));
    box-shadow: 0 0 30px rgba(246,201,69,.15);
  }
  @keyframes pop {
    from { transform: scale(.96); filter: brightness(2) }
    to   { transform: none; filter: none }
  }

  /* ── End screen ─────────────────────────── */
  #end {
    flex: 1;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: clamp(16px, 3.6vh, 38px);
    padding-bottom: 6vh;
  }
  #end.open { display: flex }
  #end .big {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(3rem, 12vh, 7rem);
    color: var(--gold);
    text-shadow: 0 0 60px rgba(246,201,69,.4);
    letter-spacing: .04em;
    animation: rise .6s ease both;
  }
  #end .sub { color: var(--text-dim); font-size: clamp(1rem, 2.4vh, 1.3rem); animation: rise .6s .15s ease both }
  #end .actions { display: flex; gap: 12px; animation: rise .6s .3s ease both }

  #list-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .btn {
    font-family: var(--body);
    text-decoration: none;
    font-weight: 700;
    font-size: clamp(.85rem, 1.9vh, 1.05rem);
    border-radius: 12px;
    padding: clamp(8px, 1.4vh, 12px) clamp(16px, 1.8vw, 26px);
    cursor: pointer;
    border: 1px solid var(--panel-edge);
    background: var(--panel);
    color: var(--text);
    transition: transform .15s, border-color .2s, box-shadow .2s;
  }
  .btn:hover { transform: translateY(-2px); border-color: var(--text-dim) }
  .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px }
  .btn.gold {
    background: linear-gradient(180deg, var(--gold-hot), var(--gold));
    color: #241a02;
    border-color: transparent;
  }
  .btn.gold:hover { box-shadow: 0 8px 26px rgba(246,201,69,.3) }
  .btn.big {
    font-size: clamp(1rem, 2.4vh, 1.3rem);
    padding: clamp(12px, 2vh, 18px) clamp(26px, 3vw, 44px);
  }
  .btn.ghost { background: none; color: var(--text-dim) }
  .btn.ghost:hover { color: var(--text) }

  .rule {
    text-align: center;
    color: var(--text-dim);
    font-size: clamp(.75rem, 1.7vh, .95rem);
  }
  .rule b { color: var(--gold); font-weight: 700 }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; transition-duration: .01s !important }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <a class="chip" href="./">‹ Alle spill</a>
    <h1>TOPP 10</h1>
    <span class="tagline">Gjett dypt – lengre ned på lista gir flere poeng</span>
    <span class="spacer"></span>
    <button class="chip danger" id="reset-btn">Nullstill</button>
  </header>

  <section id="intro">
    <div class="eyebrow" id="intro-eyebrow"></div>
    <div class="cat-name" id="intro-name"></div>
    <div class="cat-q" id="intro-q"></div>
    <div class="cat-note" id="intro-note"></div>
    <div class="rule">Riktig gjett på plass <b>1</b> gir <b>1 poeng</b> … plass <b>10</b> gir <b>10 poeng</b>. Utenfor topp 10? <b>0 poeng.</b></div>
    <div class="actions">
      <button class="btn ghost" id="intro-prev">‹ Forrige</button>
      <button class="btn gold big" id="intro-next">Neste →</button>
    </div>
  </section>

  <section id="list-view">
    <h2 id="question"></h2>
    <div id="list-note"></div>
    <div id="rows"></div>
    <div id="list-controls">
      <button class="btn ghost" id="back-btn">‹ Kategori</button>
      <button class="btn gold big" id="next-btn"></button>
    </div>
  </section>

  <section id="end">
    <div class="big">Det var alt!</div>
    <div class="sub">Tell opp poengene – hvem gjettet dypest?</div>
    <div class="actions">
      <button class="btn ghost" id="end-prev">‹ Forrige</button>
      <a class="btn gold big" href="./">Til forsiden</a>
    </div>
  </section>
</div>

<script>
// ── Data ───────────────────────────────────────────────────
const LISTS = [
  {
    key: "fifa",
    name: "FIFA-rankingen",
    q: "Hvilke herrelandslag topper FIFA-rankingen?",
    note: "Offisiell FIFA-ranking per 11. juni 2026",
    items: [
      { r: 1,  n: "Argentina" },
      { r: 2,  n: "Spania" },
      { r: 3,  n: "Frankrike" },
      { r: 4,  n: "England" },
      { r: 5,  n: "Portugal" },
      { r: 6,  n: "Brasil" },
      { r: 7,  n: "Marokko" },
      { r: 8,  n: "Nederland" },
      { r: 9,  n: "Belgia" },
      { r: 10, n: "Tyskland" },
    ],
  },
  {
    key: "insta-verden",
    name: "Instagram – verden",
    q: "Hvilke kontoer har flest følgere på Instagram?",
    note: "",
    items: [
      { r: 1,  n: "Instagram",                 d: "686 mill." },
      { r: 2,  n: "Cristiano Ronaldo",         d: "670 mill." },
      { r: 3,  n: "Lionel Messi",              d: "511 mill." },
      { r: 4,  n: "Selena Gomez",              d: "405 mill." },
      { r: 5,  n: "Kylie Jenner",              d: "≈385 mill." },
      { r: 6,  n: "Dwayne «The Rock» Johnson", d: "≈385 mill." },
      { r: 7,  n: "Ariana Grande",             d: "≈368 mill." },
      { r: 8,  n: "Kim Kardashian",            d: "≈350 mill." },
      { r: 9,  n: "Beyoncé",                   d: "≈315 mill." },
      { r: 10, n: "Khloé Kardashian",          d: "300+ mill." },
    ],
  },
  {
    key: "areal",
    name: "Land etter areal",
    q: "Hvilke land er størst i areal?",
    note: "",
    items: [
      { r: 1,  n: "Russland",   d: "17,1 mill. km²" },
      { r: 2,  n: "Canada",     d: "10,0 mill. km²" },
      { r: 3,  n: "Kina",       d: "9,6 mill. km²" },
      { r: 4,  n: "USA",        d: "9,5 mill. km²" },
      { r: 5,  n: "Brasil",     d: "8,5 mill. km²" },
      { r: 6,  n: "Australia",  d: "7,7 mill. km²" },
      { r: 7,  n: "India",      d: "3,3 mill. km²" },
      { r: 8,  n: "Argentina",  d: "2,8 mill. km²" },
      { r: 9,  n: "Kasakhstan", d: "2,7 mill. km²" },
      { r: 10, n: "Algerie",    d: "2,4 mill. km²" },
    ],
  },
  {
    key: "insta-rommet",
    name: "Instagram – i rommet",
    q: "Hvem i rommet har flest følgere på Instagram?",
    note: "Hele lista avsløres – alle 20!",
    revealRest: 10, // reveal one-by-one down to here, then the rest in one click
    items: [
      { r: 1,  n: "Maria",       d: "1500" },
      { r: 2,  n: "Anne",        d: "1126" },
      { r: 3,  n: "Kristine",    d: "1048" },
      { r: 4,  n: "Martine",     d: "959" },
      { r: 5,  n: "Julia",       d: "915" },
      { r: 6,  n: "June",        d: "913" },
      { r: 7,  n: "Sara",        d: "824" },
      { r: 8,  n: "Benedicte",   d: "732" },
      { r: 9,  n: "Mats",        d: "720" },
      { r: 10, n: "Sofia",       d: "710" },
      { r: 11, n: "Haakon",      d: "628" },
      { r: 12, n: "Kamz",        d: "610" },
      { r: 13, n: "Brit",        d: "596" },
      { r: 14, n: "Jenny",       d: "540" },
      { r: 15, n: "Andreas",     d: "478" },
      { r: 16, n: "Jonas",       d: "412" },
      { r: 17, n: "Tom",         d: "326" },
      { r: 18, n: "Han Jørgen",  d: "317" },
      { r: 19, n: "Hans Petter", d: "239" },
      { r: 20, n: "Morten",      d: "12" },
    ],
  },
  {
    key: "toppscorere",
    name: "Norske toppscorere",
    q: "Hvem har scoret flest mål for Norges herrelandslag?",
    note: "Menn – antall mål vises ved avsløring",
    items: [
      { r: 1,  n: "Erling Braut Haaland", d: "55 mål" },
      { r: 2,  n: "Jørgen Juve",          d: "33 mål" },
      { r: 3,  n: "Einar Gundersen",      d: "26 mål" },
      { r: 3,  n: "Alexander Sørloth",    d: "26 mål" },
      { r: 5,  n: "Harald Hennum",        d: "25 mål" },
      { r: 6,  n: "John Carew",           d: "24 mål" },
      { r: 7,  n: "Ole Gunnar Solskjær",  d: "23 mål" },
      { r: 7,  n: "Tore André Flo",       d: "23 mål" },
      { r: 9,  n: "Gunnar Thoresen",      d: "22 mål" },
      { r: 10, n: "Steffen Iversen",      d: "21 mål" },
    ],
  },
];

const STORAGE_KEY = "topp10-v2";

// step: which list; phase: "intro" | "list" | "end"; rev[key]: rows revealed top-down
let state = { step: 0, phase: "intro", rev: {} };

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}
try {
  const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
  if (s && typeof s.step === "number" && s.rev) state = s;
} catch (e) {}

function esc(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

// ── Views ──────────────────────────────────────────────────
const introEl = document.getElementById("intro");
const listEl = document.getElementById("list-view");
const endEl = document.getElementById("end");
const rowsEl = document.getElementById("rows");
const nextBtn = document.getElementById("next-btn");

function render() {
  introEl.classList.toggle("open", state.phase === "intro");
  listEl.classList.toggle("open", state.phase === "list");
  endEl.classList.toggle("open", state.phase === "end");
  if (state.phase === "intro") renderIntro();
  if (state.phase === "list") renderList();
  save();
}

function renderIntro() {
  const list = LISTS[state.step];
  document.getElementById("intro-eyebrow").textContent = `Kategori ${state.step + 1} av ${LISTS.length}`;
  document.getElementById("intro-name").textContent = list.name;
  document.getElementById("intro-q").textContent = list.q;
  document.getElementById("intro-note").textContent = list.note;
  document.getElementById("intro-prev").style.visibility = state.step === 0 ? "hidden" : "visible";
  // restart the entrance animation
  introEl.querySelectorAll(".eyebrow, .cat-name, .cat-q, .cat-note, .actions").forEach(el => {
    el.style.animation = "none";
    void el.offsetWidth;
    el.style.animation = "";
  });
}

function renderList() {
  const list = LISTS[state.step];
  const revealed = state.rev[list.key] || 0;
  document.getElementById("question").textContent = list.q;
  document.getElementById("list-note").textContent = list.note;
  rowsEl.className = list.items.length > 10 ? "cols-2" : "cols-1";
  rowsEl.innerHTML = "";
  list.items.forEach((item, i) => {
    const isOpen = i < revealed; // top-down: first `revealed` rows are open
    const el = document.createElement("div");
    el.className = "row" + (isOpen ? " revealed" : "") + (item.r === 1 ? " top1" : "");
    el.innerHTML = isOpen
      ? `<span class="rank">${item.r}</span><span class="name">${esc(item.n)}</span>` +
        (item.d ? `<span class="detail">${esc(item.d)}</span>` : "")
      : `<span class="rank">${item.r}</span><span class="mystery"><i></i></span>`;
    rowsEl.appendChild(el);
  });

  if (revealed < list.items.length) {
    if (list.revealRest && revealed >= list.revealRest) {
      nextBtn.textContent = `Avslør resten (${list.items[revealed].r}–${list.items[list.items.length - 1].r})`;
    } else {
      nextBtn.textContent = `Avslør plass ${list.items[revealed].r}`;
    }
  } else {
    nextBtn.textContent = state.step === LISTS.length - 1 ? "Ferdig →" : "Neste kategori →";
  }
}

// ── Actions ────────────────────────────────────────────────
document.getElementById("intro-next").addEventListener("click", () => {
  state.phase = "list";
  render();
});
document.getElementById("intro-prev").addEventListener("click", () => {
  if (state.step === 0) return;
  state.step--;
  state.phase = "list";
  render();
});
document.getElementById("back-btn").addEventListener("click", () => {
  state.phase = "intro";
  render();
});
document.getElementById("end-prev").addEventListener("click", () => {
  state.step = LISTS.length - 1;
  state.phase = "list";
  render();
});

nextBtn.addEventListener("click", () => {
  const list = LISTS[state.step];
  const revealed = state.rev[list.key] || 0;
  if (revealed < list.items.length) {
    if (list.revealRest && revealed >= list.revealRest) {
      state.rev[list.key] = list.items.length;       // the rest in one click
    } else {
      state.rev[list.key] = revealed + 1;            // one by one, from the top
    }
  } else if (state.step === LISTS.length - 1) {
    state.phase = "end";
  } else {
    state.step++;
    state.phase = "intro";
  }
  render();
});

document.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") {
    if (e.target.tagName === "BUTTON" || e.target.tagName === "A") return;
    e.preventDefault();
    if (state.phase === "intro") document.getElementById("intro-next").click();
    else if (state.phase === "list") nextBtn.click();
  }
});

// ── Reset (two-step confirm) ───────────────────────────────
const resetBtn = document.getElementById("reset-btn");
let resetTimer = null;
resetBtn.addEventListener("click", () => {
  if (resetBtn.classList.contains("armed")) {
    clearTimeout(resetTimer);
    state = { step: 0, phase: "intro", rev: {} };
    resetBtn.classList.remove("armed");
    resetBtn.textContent = "Nullstill";
    render();
  } else {
    resetBtn.classList.add("armed");
    resetBtn.textContent = "Sikker? Trykk igjen";
    resetTimer = setTimeout(() => {
      resetBtn.classList.remove("armed");
      resetBtn.textContent = "Nullstill";
    }, 3000);
  }
});

render();
</script>
</body>
</html>
