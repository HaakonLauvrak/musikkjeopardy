<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kveldens spill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #07080f;
    --panel: #12152a;
    --panel-edge: #232849;
    --gold: #f6c945;
    --gold-hot: #ffe08a;
    --violet: #8b7cff;
    --text: #f2f1ec;
    --text-dim: #9a9cb5;
    --display: "Anton", sans-serif;
    --body: "Space Grotesk", sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: var(--body);
    background:
      radial-gradient(ellipse 50% 45% at 50% 0%, rgba(139,124,255,.16), transparent 65%),
      radial-gradient(ellipse 55% 45% at 50% 110%, rgba(246,201,69,.12), transparent 65%),
      var(--ink);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(20px, 4.5vh, 46px);
    width: min(1100px, 94vw);
    text-align: center;
    padding: 24px;
  }

  .eyebrow {
    color: var(--violet);
    letter-spacing: .34em;
    text-transform: uppercase;
    font-size: clamp(.7rem, 1.6vh, .95rem);
    animation: rise .7s ease both;
  }
  h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(3rem, 12vh, 7rem);
    line-height: .95;
    letter-spacing: .04em;
    color: var(--gold);
    text-shadow: 0 0 60px rgba(246,201,69,.4);
    animation: rise .7s .12s ease both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(18px) }
    to   { opacity: 1; transform: none }
  }

  .games {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: clamp(14px, 2vw, 26px);
    width: 100%;
  }
  .game {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(8px, 1.6vh, 16px);
    background: linear-gradient(180deg, #171b36, #0d1022);
    border: 1px solid var(--panel-edge);
    border-radius: 20px;
    padding: clamp(26px, 6vh, 56px) clamp(20px, 3vw, 44px);
    text-decoration: none;
    color: var(--text);
    transition: transform .2s ease, border-color .2s, box-shadow .2s;
    animation: rise .7s .28s ease both;
  }
  .game:nth-child(2) { animation-delay: .4s }
  .game:hover, .game:focus-visible {
    transform: translateY(-5px);
    border-color: var(--gold);
    box-shadow: 0 18px 60px rgba(246,201,69,.16);
    outline: none;
  }
  .game .icon { font-size: clamp(2rem, 6vh, 3.4rem); line-height: 1 }
  .game .name {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(1.5rem, 4.2vh, 2.6rem);
    letter-spacing: .06em;
    color: var(--gold);
  }
  .game .desc {
    color: var(--text-dim);
    font-size: clamp(.85rem, 2vh, 1.1rem);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01s !important; transition-duration: .01s !important }
  }
</style>
</head>
<body>
<main>
  <div>
    <div class="eyebrow">Velkommen til</div>
    <h1>Kveldens spill</h1>
  </div>
  <nav class="games">
    <a class="game" href="jeopardy.html">
      <span class="icon">🎵</span>
      <span class="name">MUSIKKJEOPARDY</span>
      <span class="desc">Hør låta. Gjett svaret. Stjel poengene.</span>
    </a>
    <a class="game" href="topp10.html">
      <span class="icon">🏆</span>
      <span class="name">TOPP 10</span>
      <span class="desc">Gjett trygt eller gjett dypt – lengre ned på lista gir flere poeng.</span>
    </a>
  </nav>
</main>
</body>
</html>
